name: 🏗️ Build, Test and Release

on:
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - 'src/**'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    outputs:
      rust-changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'

  build-native:
    name: Build native - ${{ matrix.settings.target }}
    needs: check-changes
    if: needs.check-changes.outputs.rust-changed == 'true' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
            build: npm run build:rust -- --target x86_64-apple-darwin
          - host: macos-14
            target: aarch64-apple-darwin
            arch: arm64
            build: npm run build:rust -- --target aarch64-apple-darwin
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
            build: npm run build:rust -- --target aarch64-unknown-linux-gnu
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x64
            build: npm run build:rust -- --target x86_64-unknown-linux-musl
          - host: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x64
            build: npm run build:rust -- --target x86_64-pc-windows-msvc

    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          architecture: ${{ matrix.settings.arch }}
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          shared-key: ${{ matrix.settings.target }}

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja -y

      - name: Setup NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Cache musl cross toolchain
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        uses: actions/cache@v5
        with:
          path: ~/musl-cross
          key: musl-cross-${{ runner.os }}-x86_64-11-20211120

      - name: Install musl cross toolchain
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          set -eux
          rustup target add x86_64-unknown-linux-musl
          TOOLCHAIN_URL="https://github.com/troglobit/misc/releases/download/11-20211120/x86_64-linux-musl-cross.tgz"
          TOOLCHAIN_DIR="$HOME/musl-cross/x86_64-linux-musl-cross"
          if [ ! -d "$TOOLCHAIN_DIR" ]; then
            mkdir -p "$HOME/musl-cross"
            curl -L "$TOOLCHAIN_URL" -o /tmp/x86_64-linux-musl-cross.tgz
            tar -xzf /tmp/x86_64-linux-musl-cross.tgz -C "$HOME/musl-cross"
          fi
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Patch boring-sys2 on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd rust
          cargo fetch
          FILE=$(find ~/.cargo/registry/src -name "main.rs" | grep "boring-sys2" | grep "build")
          if [ -z "$FILE" ]; then echo "Error: Could not find boring-sys2 build/main.rs to patch"; exit 1; fi
          echo "Patching $FILE"
          sed -i 's/let bssl_dir = built_boring_source_path(config);/let bssl_dir = built_boring_source_path(config); if config.target.ends_with("-msvc") { println!("cargo:rustc-link-search=native={}\/lib", bssl_dir.display()); }/' "$FILE"
          sed -i 's/cfg.build_target("ssl").build();/\/\/ cfg.build_target("ssl").build();/' "$FILE"
          sed -i 's/cfg.build_target("crypto").build()/cfg.build_target("ALL_BUILD").build()/' "$FILE"

      - name: Build native module (musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        env:
          CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: x86_64-linux-musl-gcc
          CC_x86_64_unknown_linux_musl: x86_64-linux-musl-gcc
          CXX_x86_64_unknown_linux_musl: x86_64-linux-musl-g++
          AR_x86_64_unknown_linux_musl: x86_64-linux-musl-ar
          RANLIB_x86_64_unknown_linux_musl: x86_64-linux-musl-ranlib
          RUSTFLAGS: -C target-feature=-crt-static
        run: npm run build:rust

      - name: Build native module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_DIR: rust/target
        run: ${{ matrix.settings.build }}

      - name: Build native module
        if: runner.os != 'Windows' && matrix.settings.target != 'x86_64-unknown-linux-musl'
        run: ${{ matrix.settings.build }}

      - name: Smoke test
        if: matrix.settings.target != 'x86_64-unknown-linux-musl'
        env:
          WREQ_TARGET: ${{ matrix.settings.target }}
        run: node scripts/smoke-native.cjs

      - name: Smoke test (musl via Docker)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm \
            -e WREQ_PLATFORM_ARCH=linux-x64-musl \
            -v "$PWD:/app" -w /app \
            node:20-alpine node scripts/smoke-native.cjs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: rust/*.node
          if-no-files-found: error

  download-binaries:
    name: Reuse binaries from release
    needs: check-changes
    if: needs.check-changes.outputs.rust-changed == 'false' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - x86_64-pc-windows-msvc

    steps:
      - name: Download from latest release
        run: |
          gh release download binaries-latest \
            --repo ${{ github.repository }} \
            --pattern "wreq-js.*${{ matrix.target }}*.node" \
            --dir artifacts/ \
            --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Re-upload as artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: artifacts/*.node
          if-no-files-found: warn

  test:
    name: Tests - Node ${{ matrix.node-version }} (${{ matrix.platform-arch }})
    needs: [check-changes, build-native, download-binaries]
    if: always() && !cancelled() && (needs.build-native.result == 'success' || needs.build-native.result == 'skipped') && (needs.download-binaries.result == 'success' || needs.download-binaries.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node-version: 20
            arch: x64
            platform-arch: linux-x64-gnu
          - os: ubuntu-24.04
            node-version: 22
            arch: x64
            platform-arch: linux-x64-gnu
          - os: ubuntu-24.04
            node-version: 24
            arch: x64
            platform-arch: linux-x64-gnu
          - os: macos-15-intel
            node-version: 20
            arch: x64
            platform-arch: darwin-x64
          - os: macos-15-intel
            node-version: 22
            arch: x64
            platform-arch: darwin-x64
          - os: macos-15-intel
            node-version: 24
            arch: x64
            platform-arch: darwin-x64
          - os: windows-2022
            node-version: 20
            arch: x64
            platform-arch: win32-x64-msvc
          - os: windows-2022
            node-version: 22
            arch: x64
            platform-arch: win32-x64-msvc
          - os: windows-2022
            node-version: 24
            arch: x64
            platform-arch: win32-x64-msvc
          - os: macos-14
            node-version: 24
            arch: arm64
            platform-arch: darwin-arm64
          - os: ubuntu-24.04-arm
            node-version: 24
            arch: arm64
            platform-arch: linux-arm64-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download native addon artifact
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.platform-arch }}
          path: artifacts

      - name: Place native addon
        shell: bash
        run: |
          mkdir -p rust
          find artifacts -name "*.node" -exec cp {} rust/ \;
          ls -la rust/*.node

      - name: Run tests
        if: "!(matrix.os == 'ubuntu-24.04' && matrix.node-version == 24 && matrix.arch == 'x64')"
        run: npm exec -- tsx src/test/run-with-local-server.ts

      - name: Run coverage tests
        if: matrix.os == 'ubuntu-24.04' && matrix.node-version == 24 && matrix.arch == 'x64'
        run: npm exec -- c8 --reporter=text-summary --reporter=lcov -- tsx src/test/run-with-local-server.ts

      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node-version == 24 && matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run ci:biome

  release-binaries:
    name: Release binaries
    runs-on: ubuntu-24.04
    needs: [build-native, test]
    if: always() && needs.build-native.result == 'success' && needs.test.result == 'success'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect .node files
        run: |
          mkdir -p dist-binaries
          find artifacts -name "*.node" -exec cp {} dist-binaries/ \;
          ls -la dist-binaries/

      - name: Create or update release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: binaries-latest
          name: Latest native binaries
          prerelease: true
          files: dist-binaries/*.node

  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    needs: [build-native, test]
    if: github.event_name == 'release' && needs.build-native.result == 'success' && needs.test.result == 'success'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Move artifacts to rust directory
        run: |
          find artifacts -name "*.node" -exec cp {} rust/ \;
          ls -la rust/*.node
      - run: npm run build:ts
      - run: npm publish --provenance --access public
